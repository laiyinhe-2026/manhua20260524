<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 漫画 / 角色生图工作台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1120px;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #172033;
      background: #eef2f7;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #d9dee8;
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .topbar p { margin: 4px 0 0; color: #64748b; font-size: 12px; }
    .shell {
      height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 240px minmax(720px, 1fr);
      overflow: hidden;
    }
    .sidebar {
      padding: 18px 14px;
      background: #172033;
      color: #fff;
      overflow-y: auto;
    }
    .main {
      padding: 20px;
      overflow-y: auto;
    }
    .step-btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      text-align: left;
      color: #dbe4f0;
      background: transparent;
    }
    .step-btn.active { background: #fff; color: #172033; }
    .step-btn small { display: block; margin-top: 6px; opacity: .72; }
    .card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(23, 32, 51, .08);
    }
    .card h2, .card h3 { margin: 0; }
    .muted { color: #64748b; font-size: 14px; line-height: 1.7; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    label span {
      display: block;
      margin: 0 0 6px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid #d9dee8;
      border-radius: 6px;
      padding: 9px 10px;
      outline: none;
      background: #fff;
    }
    textarea { min-height: 116px; resize: vertical; line-height: 1.6; }
    input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #dbeafe;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #d9dee8;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
    }
    .btn.primary { border-color: #2563eb; background: #2563eb; color: #fff; }
    .btn.danger { border-color: #fecaca; color: #dc2626; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      border-radius: 6px;
      padding: 4px 8px;
      background: #f1f5f9;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
    }
    .badge.ok { background: #ecfdf5; color: #047857; }
    .badge.wait { background: #fff7ed; color: #c2410c; }
    .badge.run { background: #eff6ff; color: #2563eb; }
    .status-line {
      margin-top: 10px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .thumbs, .result-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .thumb {
      position: relative;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .thumb h4 {
      margin: 7px 24px 5px 0;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thumb img {
      display: block;
      width: 100%;
      height: 86px;
      border-radius: 6px;
      object-fit: cover;
      background: #f1f5f9;
      cursor: zoom-in;
    }
    .thumb label {
      display: block;
      margin-top: 8px;
    }
    .thumb input, .thumb textarea {
      padding: 6px 7px;
      font-size: 12px;
    }
    .thumb textarea {
      min-height: 46px;
    }
    .icon-delete {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      border: 1px solid #fecaca;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.94);
      color: #dc2626;
      padding: 0;
    }
    .icon-delete svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
    }
    .reference-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }
    .reference-section {
      min-width: 0;
      margin-top: 0;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #f8fafc;
      padding: 12px;
    }
    .reference-section h3 {
      margin: 0;
      font-size: 15px;
    }
    .reference-section .toolbar {
      margin-bottom: 10px;
    }
    .reference-section .thumbs {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .reference-section .lock-block {
      max-height: 70px;
      overflow: auto;
      padding: 7px 8px;
      font-size: 11px;
    }
    .result-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .result-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
      cursor: zoom-in;
    }
    .image-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      overflow: auto;
      background: rgba(15, 23, 42, .88);
    }
    .image-toolbar {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 41;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .image-meta {
      position: fixed;
      left: 18px;
      top: 16px;
      z-index: 41;
      max-width: min(620px, calc(100vw - 180px));
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }
    .image-meta h3 { margin: 0; font-size: 16px; }
    .image-meta p { margin: 4px 0 0; color: #cbd5e1; font-size: 12px; }
    .image-stage {
      min-width: 100%;
      min-height: 100%;
      padding: 64px 24px 28px;
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
    }
    .preview-image {
      display: block;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: initial;
      background: transparent;
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    .lock-block {
      margin: 10px 0;
      border-left: 3px solid #2563eb;
      background: #f8fafc;
      padding: 10px 12px;
      color: #334155;
      font-size: 12px;
      line-height: 1.7;
    }
    pre {
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      border-radius: 6px;
      background: #f8fafc;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
    }
    .record-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .record-item {
      flex: 0 0 280px;
      border: 1px solid #d9dee8;
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
    }
    .record-item img {
      width: 58px;
      height: 74px;
      border-radius: 6px;
      object-fit: cover;
      float: left;
      margin-right: 10px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, .48);
      padding: 30px;
    }
    .modal-panel {
      width: min(1060px, 100%);
      max-height: 82vh;
      overflow: auto;
      border-radius: 10px;
      background: #fff;
      padding: 18px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, .25);
    }

    /* visual refresh */
    body {
      font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      font-weight: 300;
      color: #182033;
      background:
        linear-gradient(135deg, rgba(124, 58, 237, .09), transparent 28%),
        linear-gradient(225deg, rgba(6, 182, 212, .08), transparent 32%),
        repeating-linear-gradient(90deg, rgba(148, 163, 184, .08) 0 1px, transparent 1px 44px),
        #f5f7fc;
    }
    .topbar {
      height: 58px;
      background: rgba(255,255,255,.76);
      border-bottom: 1px solid rgba(148, 163, 184, .28);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(71, 85, 105, .08);
    }
    .topbar h1 {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0;
      color: #111827;
    }
    .topbar p {
      color: #64748b;
      font-weight: 300;
    }
    .shell {
      height: calc(100vh - 58px);
      grid-template-columns: 236px minmax(780px, 1fr);
    }
    .sidebar {
      background:
        linear-gradient(180deg, rgba(20, 24, 43, .98), rgba(28, 30, 58, .98)),
        linear-gradient(135deg, rgba(129, 140, 248, .18), transparent);
      border-right: 1px solid rgba(255,255,255,.08);
      box-shadow: inset -1px 0 0 rgba(255,255,255,.06);
    }
    .main {
      padding: 22px 24px 34px;
    }
    .step-btn {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 13px 12px;
      color: rgba(226, 232, 240, .86);
      font-weight: 300;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .step-btn:hover {
      background: rgba(255,255,255,.07);
      border-color: rgba(255,255,255,.08);
      transform: translateX(2px);
    }
    .step-btn.active {
      background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(245,243,255,.92));
      color: #312e81;
      border-color: rgba(196, 181, 253, .55);
      box-shadow: 0 14px 34px rgba(17, 24, 39, .22);
    }
    .card {
      border: 1px solid rgba(203, 213, 225, .72);
      border-radius: 14px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 20px 60px rgba(71, 85, 105, .11);
      backdrop-filter: blur(14px);
    }
    .card h2 {
      font-size: 22px;
      font-weight: 500;
      color: #111827;
    }
    .card h3 {
      font-weight: 500;
      color: #1e1b4b;
    }
    .muted {
      color: #64748b;
      font-weight: 300;
    }
    label span {
      color: #475569;
      font-weight: 400;
    }
    input, textarea, select {
      border-color: rgba(148, 163, 184, .42);
      border-radius: 10px;
      background: rgba(255,255,255,.86);
      color: #1e293b;
      font-weight: 300;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, .14);
    }
    .btn {
      border-radius: 10px;
      border-color: rgba(148, 163, 184, .42);
      background: rgba(255,255,255,.88);
      color: #334155;
      font-weight: 400;
      box-shadow: 0 8px 20px rgba(71, 85, 105, .06);
    }
    .btn.primary {
      border-color: transparent;
      background: linear-gradient(135deg, #6d5dfc, #10b8d9);
      color: #fff;
      box-shadow: 0 14px 34px rgba(79, 70, 229, .28);
    }
    .thumb, .reference-section, .record-item {
      border-color: rgba(203, 213, 225, .72);
      border-radius: 12px;
      background: rgba(255,255,255,.74);
    }
    .thumb img, .result-card img {
      border-radius: 10px;
    }
    .lock-block, pre {
      border-radius: 10px;
      background: rgba(248, 250, 252, .88);
      border-left-color: #8b5cf6;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>AI 漫画 / 角色生图工作台</h1>
      <p id="topMeta"></p>
    </div>
    <div class="actions">
      <button class="btn" onclick="saveDraft(true)">保存草稿</button>
      <button class="btn" onclick="toggleHistory()">历史记录</button>
      <button class="btn" onclick="toggleTemplates()">提示词模板</button>
      <button class="btn" onclick="downloadProject()">导出项目 JSON</button>
      <button class="btn" onclick="resetDemo()">恢复演示</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  <div id="historyModal"></div>
  <div id="templateModal"></div>
  <div id="imageModal"></div>

  <script>
    const STORAGE_KEY = "ai-comic-simple-flow-html";
    const IMAGE_DB_NAME = "ai-comic-reference-images";
    const IMAGE_DB_STORE = "referenceImages";
    const BUILTIN_PPIO_API_KEY = "";
    const BUILTIN_GRSAI_API_KEY = "";
    const PROMPT_TEMPLATE_FILES = {
      optimizeStory: "/prompts/01-optimize-story.md",
      generateStoryboard: "/prompts/02-generate-storyboard.md",
      comicImagePrompt: "/prompts/03-comic-image-prompt.md",
      illustrationImagePrompt: "/prompts/04-illustration-image-prompt.md",
      optimizeImagePrompt: "/prompts/05-optimize-image-prompt.md",
      continuitySummary: "/prompts/06-continuity-summary.md"
    };
    const FALLBACK_PROMPT_TEMPLATES = {
      optimizeStory: [
        "请根据用户提供的剧情概要、作品设定资料、角色设定和场景参考图，优化成一个适合后续拆分为多格漫画的完整剧情。",
        "优化后的剧情需要包含明确的起、承、转、合，角色关系清楚，事件推进连贯，情绪变化明确，画面感强。",
        "可以适度补足动作、情绪和画面细节，但不要额外新增主线、重要角色、世界观规则或与用户剧情概要无关的大段支线。",
        "必须严格遵守作品设定资料和禁止偏离项，不要擅自改变世界观、人物身份、人物关系、核心剧情大纲和场景时代背景。",
        "当前阶段只输出优化后的完整剧情文本，不要输出分镜、格数拆分、标题、解释、前言或后记。",
        "",
        "【剧情概要】",
        "{{story}}",
        "",
        "【作品设定资料】",
        "{{projectBible}}",
        "",
        "【角色设定与参考图】",
        "{{roleSummary}}",
        "",
        "【场景参考图】",
        "{{sceneSummary}}",
        "",
        "后续计划拆分漫画总格数 N：{{totalComicPanels}}"
      ].join("\n"),
      generateStoryboard: [
        "请根据漫画剧情描述，分成分镜图（一个漫画格为一个分镜）。",
        "只输出 JSON 数组，不要 Markdown。数组元素字段固定为：scene, action, camera, text, characterNames, sceneRefName。",
        "每个分镜都必须有主角台词，text 字段只能写角色说出口的对白，不要写旁白，不要写空字符串。",
        "每句台词要短、具体、适合放进漫画对白气泡里。",
        "必须严格遵守作品设定资料、参考图绑定和禁止偏离项。",
        "分镜数量必须严格等于漫画总格数 N：{{totalComicPanels}}。",
        "characterNames 必须是本分镜出场角色名数组，名称必须来自参考图绑定里的角色名/身份或别名。",
        "sceneRefName 必须写本分镜使用的场景参考图名称；如果没有场景图则写空字符串。",
        "",
        "【优化后的漫画剧情】",
        "{{optimizedStory}}",
        "",
        "【作品设定资料】",
        "{{projectBible}}",
        "",
        "【参考图绑定】",
        "{{referenceSummary}}"
      ].join("\n"),
      comicImagePrompt: [
        "请依据用户提供的分镜脚本及以下输入参数，为当前漫画页生成图片生成提示词。",
        "仅输出生成的提示词，不附加任何解释说明。",
        "当前生成第 {{pageIndex}}/{{pageCount}} 张图片，只能表现分镜 {{panelRange}}，不要加入其他分镜或后续剧情。",
        "图片必须是一张完整漫画页，且必须正好包含 {{expectedPanelCount}} 个分镜格，不能少格，不能多格，不能用上一页内容、上一页参考图或其他分镜补格。每个分镜都有对白气泡，不要旁白框。",
        "版式必须有动态漫画感，不能太方方正正，不能是平均网格或等分切割。",
        "必须明确要求人物严格对应参考图，场景严格对应参考图，不得混合五官、服装、发色，不得生成未绑定参考图的新主角。",
        "上一页参考图只用于连续性，不改变当前页分镜内容。",
        "最终提示词必须固定为中文。",
        "",
        "【作品设定资料】",
        "{{projectBible}}",
        "",
        "{{referenceBinding}}",
        "",
        "{{consistencyBlock}}",
        "",
        "{{continuityBlock}}",
        "",
        "【本页分镜】",
        "{{storyboardPanels}}",
        "",
        "【基础提示词资料】",
        "{{basePrompt}}"
      ].join("\n"),
      illustrationImagePrompt: [
        "请依据用户提供的剧情、画面来源、人物参考图和场景参考图，为当前纯图生成图片生成提示词。",
        "仅输出生成的提示词，不附加任何解释说明。",
        "当前纯图只对应一个分镜：分镜 {{panelNumber}}。必须只表现【画面来源】里的这一条分镜，不要复用第 1 个分镜，不要混入其他分镜或后续剧情。",
        "生成单张完整分镜稿 / 电影分镜概念图，不是漫画页，不包含分镜格，不做多格排版。",
        "人物数量、动作和场景必须跟随当前分镜。可单人、双人或多人同框；如果多人出现，必须写清站位、互动、动作关系、前后景关系和每个角色对应的参考图。",
        "纯图里绝对不要出现对白、台词、文字、旁白、拟声词、对话气泡、漫画框线或任何字幕。",
        "参考图优先级最高。人物参考图只锁定对应角色的脸、发型、发色、服装、配饰、体型和气质；场景参考图只锁定对应场景的空间结构、固定道具、光线和色调。不要让画风、镜头、构图或文字描述覆盖参考图身份。",
        "最终提示词必须固定为中文。",
        "",
        "【作品设定资料】",
        "{{projectBible}}",
        "",
        "{{referenceBinding}}",
        "",
        "{{consistencyBlock}}",
        "",
        "【画面来源】",
        "{{illustrationSource}}",
        "",
        "【本张纯图规则】",
        "{{illustrationVariant}}",
        "",
        "【基础提示词资料】",
        "{{basePrompt}}"
      ].join("\n"),
      optimizeImagePrompt: [
        "请根据用户优化要求，优化下面这份 {{imageModelLabel}} 生图提示词。",
        "只输出优化后的最终提示词正文，不要 Markdown，不要解释。",
        "必须原样保留原提示词中的【参考图绑定，必须严格遵守】段落，尤其是参考图数组下标与身份说明。",
        "必须保留人物一致性锁定、场景一致性锁定、分镜数量、分镜顺序和对白或无对白规则。",
        "必须遵守作品设定资料，不要新增额外分镜，不要新增未上传参考图中的人物。",
        "最终提示词必须固定为中文。",
        "",
        "【作品设定资料】",
        "{{projectBible}}",
        "",
        "【用户优化要求】",
        "{{requirement}}",
        "",
        "【原提示词】",
        "{{originalPrompt}}"
      ].join("\n"),
      continuitySummary: [
        "请根据本页漫画分镜和最终生图提示词，生成供下一页延续使用的连续性摘要。",
        "只输出简洁中文摘要，不要 Markdown。",

    function openImageDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(IMAGE_DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(IMAGE_DB_STORE)) {
            db.createObjectStore(IMAGE_DB_STORE, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function putReferenceImage(id, url) {
      if (!id || !url || !url.startsWith("data:")) return;
      const db = await openImageDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_DB_STORE, "readwrite");
        tx.objectStore(IMAGE_DB_STORE).put({ id, url, updatedAt: new Date().toISOString() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function getReferenceImage(id) {
      const db = await openImageDb();
      const record = await new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_DB_STORE, "readonly");
        const request = tx.objectStore(IMAGE_DB_STORE).get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      db.close();
      return record?.url || "";
    }

    async function deleteReferenceImage(id) {
      const db = await openImageDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_DB_STORE, "readwrite");
        tx.objectStore(IMAGE_DB_STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function clearReferenceImageDb() {
      const db = await openImageDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IMAGE_DB_STORE, "readwrite");
        tx.objectStore(IMAGE_DB_STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function restoreReferenceImages() {
      const refs = state.references || [];
      let restored = 0;
      for (const ref of refs) {
        if (!ref.url && ref.imagePersisted) {
          try {
            const url = await getReferenceImage(ref.id);
            if (url) {
              ref.url = url;
              restored += 1;
            }
          } catch (error) {
            console.warn("参考图恢复失败", ref.id, error);
          }
        }
      }
      if (restored) addRecordLog(`已恢复参考图 ${restored} 张`);
    }

    function saveDraft(addLog) {
      state.updatedAt = new Date().toISOString();

        localStorage.setItem(STORAGE_KEY, JSON.stringify(getDraftState()));
      } catch (error) {
        console.warn("草稿保存失败，正在清理旧草稿并保存轻量版本。", error);
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(getDraftState()));
        } catch (retryError) {
          console.warn("轻量草稿仍保存失败，仅保留当前页面内存数据。", retryError);
        }
      }
      render();
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(`读取图片失败：${file.name}`));
        reader.readAsDataURL(file);
      });
    }

    function dataUrlBytes(dataUrl = "") {
      const base64 = String(dataUrl).split(",")[1] || "";
      return Math.round(base64.length * 0.75);
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("图片压缩失败：无法读取图片"));
        image.src = src;
      });
    }

    async function compressImageDataUrl(dataUrl, options = {}) {
      if (!dataUrl || !dataUrl.startsWith("data:image/")) return dataUrl;
      const maxSide = options.maxSide || 1280;
      const maxBytes = options.maxBytes || 850 * 1024;
      if (dataUrlBytes(dataUrl) <= maxBytes) return dataUrl;

      const image = await loadImageElement(dataUrl);
      const scale = Math.min(1, maxSide / Math.max(image.naturalWidth || image.width, image.naturalHeight || image.height));
      const width = Math.max(1, Math.round((image.naturalWidth || image.width) * scale));
      const height = Math.max(1, Math.round((image.naturalHeight || image.height) * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(image, 0, 0, width, height);

      let quality = options.quality || 0.82;
      let output = canvas.toDataURL("image/jpeg", quality);
      while (dataUrlBytes(output) > maxBytes && quality > 0.5) {
        quality -= 0.08;
        output = canvas.toDataURL("image/jpeg", quality);
      }
      return output;
    }

    async function uploadReferences(files, type) {
      const fileList = Array.from(files || []);
      for (const file of fileList) {
        const rawDataUrl = await readFileAsDataUrl(file);
        const dataUrl = await compressImageDataUrl(rawDataUrl, { maxSide: 1400, maxBytes: 900 * 1024, quality: 0.84 });
        const sameTypeCount = state.references.filter(ref => ref.type === type).length;
        const ref = {
          id: uid("ref"),
          type,
          name: file.name,
          roleName: type === "角色图"
            ? (sameTypeCount === 0 ? "男主" : sameTypeCount === 1 ? "女主" : `角色${sameTypeCount + 1}`)
            : (sameTypeCount === 0 ? "场景" : `场景${sameTypeCount + 1}`),
          aliases: "",
          mustKeep: "",
          forbidden: "",
          lockNote: "",
          imagePersisted: true,
          url: dataUrl
        };
        state.references.unshift(ref);
        try {
          await putReferenceImage(ref.id, dataUrl);
        } catch (error) {
          console.warn("参考图持久化失败", error);
          ref.imagePersisted = false;
        }
      }
      addRecordLog(`上传${type} ${fileList.length} 张`);
      saveDraft(false);
    }

          <div class="image-meta">
            <h3>${esc(imagePreview.title)}</h3>
            <p>${esc(imagePreview.meta || "")} · 原画质预览，可滚动查看细节</p>

          <div class="image-toolbar" onclick="event.stopPropagation()">

    function normalizeEndpoint(baseUrl, path) {
      const base = (baseUrl || "").replace(/\/+$/, "");
      if (base.endsWith("/v1")) return `${base}${path}`;
      return `${base}/v1${path}`;
    }

    function getProviderKey(provider) {
      return provider === "grsai" ? BUILTIN_GRSAI_API_KEY : BUILTIN_PPIO_API_KEY;
    }

    function textModelConfig() {
      return TEXT_MODEL_OPTIONS[state.textModel] || TEXT_MODEL_OPTIONS["ppio-deepseek-v4-flash"];
    }

    function imageModelConfig() {
      return IMAGE_MODEL_OPTIONS[state.imageModel] || IMAGE_MODEL_OPTIONS["ppio-gpt-image-2"];
    }

    function textModelLabel() {
      return textModelConfig().label;
    }

    function imageModelLabel() {
      return imageModelConfig().label;
    }

    function selectedImageInterfaceName(referenceCount = 0) {
      const config = imageModelConfig();
      if (config.provider === "ppio") return referenceCount ? "gpt-image-2-edit" : "gpt-image-2-text-to-image";
      return `${config.model} /v1/api/generate${referenceCount ? "（参考图兼容字段）" : ""}`;
    }

    function referenceSlotName(index) {
      return imageModelConfig().provider === "grsai" ? `images[${index}]` : `image[${index}]`;
    }

    function shouldUseRealApi() {
      return Boolean(API_CONFIG.useRealApi);
    }

    function effectiveImageCount() {
      if (state.outputMode === "illustration") {
        return Math.max(1, Math.min(80, (state.storyboard || []).length || Number(state.generateCount) || 1));
      }
      const panelsPerImage = Math.max(3, Math.min(8, Number(state.panelsPerComicImage) || 4));
      const fullPages = Math.floor((state.storyboard || []).length / panelsPerImage);
      const requested = Math.max(1, Math.min(12, Number(state.generateCount) || 1));
      return Math.max(1, Math.min(requested, fullPages || requested));
    }

    function comicGenerationWarning() {
      if (state.outputMode !== "comic") return "";
      const panelsPerImage = Math.max(3, Math.min(8, Number(state.panelsPerComicImage) || 4));
      const totalPanels = (state.storyboard || []).length;
      const remainder = totalPanels % panelsPerImage;
      if (!totalPanels || !remainder) return "";
      return `当前分镜共 ${totalPanels} 格，每张剧情图 ${panelsPerImage} 格；最后 ${remainder} 格不足一整页，将不会生成，避免模型用上一页或参考图补格导致重复。`;
    }

    async function callTextModel(userPrompt) {
      const config = textModelConfig();
      const response = await fetch("/api/text-model", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          provider: config.provider,
          baseUrl: config.baseUrl,
          model: config.model,
          label: config.label,
          prompt: userPrompt,
          messages: [
            {
              role: "system",
              content: "你是专业漫画编剧和分镜师。输出必须清晰、结构化、可直接给用户审核编辑。"
            },
            { role: "user", content: userPrompt }
          ],
          temperature: 0.7
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error?.message || data.message || `${config.label} 调用失败：${response.status}`);
      }
      return data.choices?.[0]?.message?.content || "";
    }

    function referenceKeywordText(ref) {
      return [ref.roleName, ref.name, ref.aliases, ref.mustKeep, ref.forbidden, ref.lockNote]
        .filter(Boolean)
        .join(" ")
        .replace(/\.[a-z0-9]+$/i, "");
    }

    function panelTextForMatching(panels = []) {
      return panels
        .map(item => [item.scene, item.action, item.camera, item.text].filter(Boolean).join(" "))
        .join("\n");
    }

    function refMatchesText(ref, text) {
      const source = String(text || "");
      const keywords = referenceKeywordText(ref)
        .split(/[，,、\s/|]+/)
        .map(item => item.trim())
        .filter(item => item.length >= 2);
      return keywords.some(keyword => source.includes(keyword));
    }

    function sortReferencesForPrompt(refs = []) {
      const roleRank = (ref) => {
        const name = ref.roleName || "";
        if (ref.type === "场景图") return 100;
        if (name.includes("男主")) return 1;
        if (name.includes("女主")) return 2;
        if (name.includes("主角")) return 3;
        return 10;
      };
      return [...refs].sort((a, b) => roleRank(a) - roleRank(b));
    }

    function uniqueReferences(refs = []) {
      const seen = new Set();
      return refs.filter(ref => {
        if (!ref || seen.has(ref.id)) return false;
        seen.add(ref.id);
        return true;
      });
    }

    function hasTwoCharacterCue(text = "") {
      return /两人|二人|双人|对视|对话|交谈|一起|并肩|他们|她们|男.*女|女.*男|男主.*女主|女主.*男主/.test(text);
    }

    function addLikelyCharacterReferences(selectedCharacters, allCharacters, text = "") {
      const sortedCharacters = sortReferencesForPrompt(allCharacters);
      const next = [...selectedCharacters];
      const addByKeyword = (keywords) => {
        const found = sortedCharacters.find(ref => {
          const name = `${ref.roleName || ""} ${ref.name || ""} ${ref.lockNote || ""}`;
          return keywords.some(keyword => name.includes(keyword));
        });
        if (found) next.push(found);
      };

      if (/男主|男学生|男孩|少年|他\b|他[，。；、\s]/.test(text)) addByKeyword(["男主", "男", "少年", "学生"]);
      if (/女主|女角色|女孩|少女|她\b|她[，。；、\s]/.test(text)) addByKeyword(["女主", "女", "少女", "女孩"]);
      if (hasTwoCharacterCue(text) && sortedCharacters.length >= 2) next.push(sortedCharacters[0], sortedCharacters[1]);

      return uniqueReferences(next);
    }

    function selectReferencesForPanels(panels = state.storyboard) {
      const text = panelTextForMatching(panels);
      const usable = (state.references || []).filter(ref => ref.url && !ref.url.startsWith("blob:"));
      const characters = usable.filter(ref => ref.type === "角色图");
      const scenes = usable.filter(ref => ref.type === "场景图");
      const explicitCharacterIds = new Set(panels.flatMap(panel => panel.characterIds || []));
      const explicitSceneIds = new Set(panels.map(panel => panel.sceneRefId).filter(Boolean));
      let selectedCharacters = characters.filter(ref => explicitCharacterIds.has(ref.id) || refMatchesText(ref, text));
      let selectedScenes = scenes.filter(ref => explicitSceneIds.has(ref.id) || refMatchesText(ref, text));
      selectedCharacters = addLikelyCharacterReferences(selectedCharacters, characters, text);

      // 分镜没有明确写角色名时，仍传第一张角色图作为“主角”锁定，不把其他角色混进去。
      if (!selectedCharacters.length && characters.length) selectedCharacters = [sortReferencesForPrompt(characters)[0]];
      if (!selectedScenes.length && scenes.length) selectedScenes = [sortReferencesForPrompt(scenes)[0]];

      return sortReferencesForPrompt([...selectedCharacters, ...selectedScenes]);
    }

    async function getReferenceImagesForApi(selectedReferences = []) {
      const config = imageModelConfig();
      const maxBytes = config.provider === "grsai" ? 620 * 1024 : 900 * 1024;
      const maxSide = config.provider === "grsai" ? 1024 : 1280;
      const images = selectedReferences
        .filter(ref => ref.url && !ref.url.startsWith("blob:"))
        .map(ref => ref.url);
      const compressed = [];
      for (const image of images) {
        compressed.push(await compressImageDataUrl(image, { maxSide, maxBytes, quality: 0.8 }));
      }
      return compressed;
    }

    function extractImageUrlFromResponse(value) {
      if (!value) return "";
      if (typeof value === "string") {
        return /^(https?:\/\/|data:image\/)/.test(value) ? value : "";
      }
      if (Array.isArray(value)) {
        for (const item of value) {
          const found = extractImageUrlFromResponse(item);
          if (found) return found;
        }
        return "";
      }
      if (typeof value === "object") {
        if (value.b64_json) return `data:image/png;base64,${value.b64_json}`;
        for (const key of ["url", "image_url", "image", "images", "data", "output", "result", "results", "urls"]) {
          const found = extractImageUrlFromResponse(value[key]);
          if (found) return found;
        }
      }
      return "";
    }

    async function callImageModel(prompt, referenceImages = []) {
      const config = imageModelConfig();
      const size = sizeFromAspectRatio(state.aspectRatio);
      const response = await fetch("/api/image-model", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          provider: config.provider,
          label: config.label,
          model: config.model,
          prompt,
          referenceImages,
          size,
          quality: state.imageQuality || API_CONFIG.imageQuality,
          background: API_CONFIG.imageBackground,
          output_format: API_CONFIG.imageOutputFormat,
          aspect_ratio: state.aspectRatio,
          imageSize: config.imageSize,
          textToImageUrl: config.textToImageUrl,
          editUrl: config.editUrl,
          url: config.url
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error?.message || data.message || `${config.label} API 调用失败：${response.status}`);
      }
      const imageUrl = extractImageUrlFromResponse(data);
      if (imageUrl) return imageUrl;
      throw new Error("生图接口返回中没有可识别的图片 URL。");
    }

    function sizeFromAspectRatio(ratio) {
      const map = {
        "1:1": "1024x1024",
        "3:4": "1024x1536",
        "4:3": "1536x1024",
        "9:16": "2160x3840",
        "16:9": "3840x2160"
      };
      return map[ratio] || "1024x1536";
    }

    function setBusy(text) {
      isBusy = true;
      busyText = text;
      render();
    }

    function clearBusy() {
      isBusy = false;
      busyText = "";
      render();
    }

    async function optimizeStory() {
      setBusy(`正在调用 ${textModelLabel()} 优化剧情...`);
      state.lastApiError = "";
      if (shouldUseRealApi()) {
        try {
          const roleSummary = state.references
            .filter(r => r.type === "角色图")
            .map((r, index) => `角色${index + 1}：${r.roleName || r.name}，对应角色参考图：${r.name}`)
            .join("；") || "暂无角色参考图";
          const sceneSummary = state.references
            .filter(r => r.type === "场景图")
            .map((r, index) => `场景${index + 1}：${r.roleName || r.name}，对应场景参考图：${r.name}`)
            .join("；") || "暂无场景参考图";
          state.optimizedStory = await callTextModel(renderPromptTemplate("optimizeStory", {
            story: state.story,
            projectBible: projectBibleText(),
            roleSummary,
            sceneSummary,
            totalComicPanels: Number(state.totalComicPanels) || 12
          }));
          state.storyApproved = false;
          addRecordLog(`${textModelLabel()} 已优化剧情，等待用户审核`);
          currentStep = "story";

        } catch (error) {
          addRecordLog(`${textModelLabel()} 调用失败：${error.message}`);
          state.lastApiError = `${textModelLabel()} 调用失败：${error.message}`;
          if (!API_CONFIG.fallbackToMock) {
            alert(state.lastApiError);
            clearBusy();
            return;
          }
        }
      }
      const n = Number(state.totalComicPanels) || 12;
      state.optimizedStory = `剧情围绕“${state.story}”展开。故事以清晰的日常或主场景开场，主角在熟悉环境中遭遇异常事件；随后角色之间产生互动和冲突，关系逐步明确；中段出现转折或危机，使主角必须做出选择；结尾形成阶段性结果，并留下适合继续展开的视觉悬念。整体剧情适合拆分为 ${n} 个漫画格，角色形象和场景氛围保持一致。`;
      state.storyApproved = false;
      addRecordLog("已优化剧情，等待用户审核");
      currentStep = "story";
      saveDraft(false);
      clearBusy();
    }

    function approveStory() {
      state.storyApproved = true;
      addRecordLog("优化剧情审核通过");
      currentStep = "plan";
      saveDraft(false);
    }

    function parseStoryboardJson(text) {
      const match = text.match(/\[[\s\S]*\]/);
      if (!match) return null;
      try {
        const arr = JSON.parse(match[0]);
        return arr.map((item) => ({
          scene: item.scene || item.sceneDescription || item.画面内容 || "",
          action: item.action || item.characterAction || item.人物动作 || "",
          camera: item.camera || item.cameraAngle || item.镜头语言 || "中景",
          text: item.text || item.dialogue || item.对白旁白 || "",
          characterNames: item.characterNames || item.characters || item.characterRefs || item.出场角色 || [],
          sceneRefName: item.sceneRefName || item.sceneRef || item.sceneName || item.场景绑定 || ""
        })).filter(item => item.scene || item.action).map(item => bindPanelReferences(item));
      } catch {
        return null;
      }
    }

    function normalizeNameList(value) {
      if (Array.isArray(value)) return value.map(String).map(item => item.trim()).filter(Boolean);
      return String(value || "").split(/[，,、/\s]+/).map(item => item.trim()).filter(Boolean);
    }

    function bindPanelReferences(item) {
      const text = [item.scene, item.action, item.text, normalizeNameList(item.characterNames).join(" "), item.sceneRefName].filter(Boolean).join(" ");
      const characterRefs = state.references.filter(ref => ref.type === "角色图");
      const sceneRefs = state.references.filter(ref => ref.type === "场景图");
      const namedCharacters = normalizeNameList(item.characterNames);
      let selectedCharacters = characterRefs.filter(ref => {
        const keywords = normalizeNameList(referenceKeywordText(ref));
        return namedCharacters.some(name => keywords.some(keyword => keyword.includes(name) || name.includes(keyword))) || refMatchesText(ref, text);
      });
      selectedCharacters = addLikelyCharacterReferences(selectedCharacters, characterRefs, text);
      const selectedScene = sceneRefs.find(ref => {
        const sceneName = String(item.sceneRefName || "");
        return (sceneName && referenceKeywordText(ref).includes(sceneName)) || refMatchesText(ref, text);
      }) || sceneRefs[0];
      return {
        ...item,
        characterIds: uniqueReferences(selectedCharacters).map(ref => ref.id),
        sceneRefId: selectedScene?.id || ""
      };
    }

    async function generateStoryboard() {
      setBusy(`正在调用 ${textModelLabel()} 生成分镜规划...`);
      state.lastApiError = "";
      if (shouldUseRealApi()) {
        try {
          const referenceSummary = state.references.map((r, index) => `参考图${index + 1}=${r.roleName || r.name}（${r.type}，${r.name}）`).join("；") || "暂无参考图";
          const content = await callTextModel(renderPromptTemplate("generateStoryboard", {
            optimizedStory: state.optimizedStory || state.story,
            projectBible: projectBibleText(),
            referenceSummary,
            totalComicPanels: Number(state.totalComicPanels) || 12
          }));
          const parsed = parseStoryboardJson(content);
          if (!parsed || !parsed.length) throw new Error(`${textModelLabel()} 返回内容无法解析为分镜 JSON。`);
          state.storyboard = parsed;
          state.storyboardApproved = false;
          addRecordLog(`${textModelLabel()} 已生成分镜规划，等待用户审核`);
          saveDraft(false);
          clearBusy();
          return;
        } catch (error) {
          addRecordLog(`分镜 API 调用失败：${error.message}`);
          state.lastApiError = `分镜 API 调用失败：${error.message}`;
          if (!API_CONFIG.fallbackToMock) {
            alert(state.lastApiError);
            clearBusy();
            return;
          }
        }
      }
      const base = state.optimizedStory || state.story;
      state.storyboard = [
        {
          scene: "夜晚教室全景，台灯照亮课桌和作业本，窗外偏冷色。",

        },
        {

        camera: "中景",
        text: "主角台词",

      });

      invalidateGeneratedPrompts();

    function removeStoryboardItem(index) {
      state.storyboard.splice(index, 1);
      state.storyboardApproved = false;
      invalidateGeneratedPrompts();
      saveDraft(false);
    }

    function moveStoryboard(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= state.storyboard.length) return;
      const [item] = state.storyboard.splice(index, 1);
      state.storyboard.splice(target, 0, item);
      invalidateGeneratedPrompts();
      saveDraft(false);
    }

      state.storyboard = state.storyboard.map(item => {
        if ((item.characterIds || []).length || item.sceneRefId) return item;
        return bindPanelReferences(item);

    function buildCharacterLockBlock(ref, referenceNumber = "") {
      const role = ref.roleName || ref.name || "未命名角色";
      const slot = referenceNumber ? referenceSlotName(Number(referenceNumber) - 1) : "";
      return [
        `【角色锁定卡：${role}】`,
        slot ? `对应传入参考图：${slot}` : "",
        `角色名/身份：${role}`,
        ref.aliases ? `剧情别名：${ref.aliases}` : "",
        "脸型五官：必须严格参考该角色图的人脸结构、眼睛特征、表情气质和年龄感。",
        "发型发色：必须保持参考图的发型轮廓、刘海方向、发色和发量。",
        "服装配饰：必须保持参考图的服装主体、配色、配饰、标志性物件和轮廓。",
        "体型气质：必须保持参考图的身材比例、角色气场和性格观感。",
        ref.mustKeep ? `必须保留：${ref.mustKeep}` : "",
        ref.forbidden ? `禁止变化：${ref.forbidden}` : "",
        "禁止把其他角色的五官、发型、服装或配饰混到此角色身上；禁止随分镜换脸、换发色、换服装。",
        ref.lockNote ? `用户补充锁定：${ref.lockNote}` : "用户补充锁定：无，默认以参考图为最高优先级。"
      ].filter(Boolean).join("\n");
    }

    function buildSceneLockBlock(ref, referenceNumber = "") {
      const scene = ref.roleName || ref.name || "未命名场景";
      const slot = referenceNumber ? referenceSlotName(Number(referenceNumber) - 1) : "";
      return [
        `【场景锁定卡：${scene}】`,
        slot ? `对应传入参考图：${slot}` : "",
        `场景名：${scene}`,
        ref.aliases ? `场景别名：${ref.aliases}` : "",
        "空间结构：必须严格参考该场景图的空间关系、远近层次、背景位置和主要构成。",
        "时间/天气/光线：必须保持参考图体现的时间段、天气、光线方向、色温和阴影关系。",
        "固定道具：必须保留场景里的核心道具、建筑/地形/家具/自然元素。",
        "色调氛围：必须保持参考图的整体色调、空气感、时代背景和视觉基调。",
        ref.mustKeep ? `固定元素：${ref.mustKeep}` : "",
        ref.forbidden ? `禁止变化：${ref.forbidden}` : "",
        "禁止把无关场景元素混入；连续剧情中固定道具和空间关系应保持稳定。",
        ref.lockNote ? `用户补充锁定：${ref.lockNote}` : "用户补充锁定：无，默认以参考图为最高优先级。"
      ].filter(Boolean).join("\n");
    }

    function buildReferenceBindingBlock(selectedReferences = []) {
      if (!selectedReferences.length) return "【参考图绑定】\n本次未传入参考图。";
      const lines = selectedReferences.map((ref, index) => {
        const label = ref.roleName || ref.name;
        return `参考图${index + 1}：${label}（对应 ${referenceSlotName(index)}，${ref.type}，文件：${ref.name}）。只用于${ref.type === "角色图" ? `${label}的外貌、服装、配饰和气质` : `${label}的空间结构、道具、光线和色调`}。`;
      });
      return [
        "【参考图绑定，必须严格遵守】",
        `以下图片会按顺序作为 ${imageModelLabel()} 请求体参考图数组传入：`,
        ...lines,
        "参考图是角色/场景身份锁定依据，优先级高于画风、构图变化和文字补充；文字只描述动作与镜头，不得覆盖参考图里的脸、发型、服装、配饰和场景结构。",
        "禁止混淆参考图数组身份；禁止把不同参考图的五官、发型、服装、配饰互相混合；禁止新增未绑定参考图的人物。"
      ].join("\n");
    }

    function buildConsistencyBlock(selectedReferences = state.references) {
      const characters = selectedReferences.filter(r => r.type === "角色图");
      const scenes = selectedReferences.filter(r => r.type === "场景图");
      return [
        "【人物一致性】",
        characters.length
          ? characters.map((ref, index) => buildCharacterLockBlock(ref, index + 1)).join("\n\n")
          : "本次未传入角色参考图。",
        "",
        "【场景一致性】",
        scenes.length
          ? scenes.map((ref, index) => buildSceneLockBlock(ref, characters.length + index + 1)).join("\n\n")
          : "本次未传入场景参考图。",
      ].join("\n");
    }

    function previousPromptForPage(pageIndex = 1) {
      return pageIndex > 1 ? state.imagePrompts?.[pageIndex - 2] : null;
    }

    function previousResultForPage(pageIndex = 1) {
      const previousPrompt = previousPromptForPage(pageIndex);
      if (!previousPrompt) return null;
      return (state.results || []).find(result => result.sourcePromptId === previousPrompt.id && result.status === "success") || null;
    }

    function buildContinuityBlock(pageIndex = 1) {
      const previousPrompt = previousPromptForPage(pageIndex);
      const previousResult = previousResultForPage(pageIndex);
      if (!previousPrompt && !previousResult) return "【上一页连续性】\n这是第一页，无上一页连续性输入。";
      return [
        "【上一页连续性】",
        previousPrompt?.continuitySummary ? `上一页连续性摘要：${previousPrompt.continuitySummary}` : "上一页连续性摘要：暂无，按上一页提示词和分镜延续。",
        previousResult?.url ? "上一页生成图会作为连续性参考图传入；只用于延续场景、时间、光线、角色状态、服装和关键道具，不改变当前页分镜内容。" : "上一页没有可用生成图，本页仅使用文本连续性。",
        previousPrompt?.prompt ? `上一页提示词摘要参考：${previousPrompt.prompt.slice(0, 1200)}` : ""
      ].filter(Boolean).join("\n");
    }

    function formatStoryboardPanels(panels, startIndex = 0) {
      return panels.map((item, index) => {
        const dialogue = item.text && item.text.trim() ? item.text.trim() : "请根据剧情补充一句主角台词";
        return `分镜${startIndex + index + 1}：${item.scene}；动作：${item.action}；镜头：${item.camera}；必须出现的主角台词：${dialogue}`;
      }).join("\n");
    }

    function formatIllustrationSource(panels = [], startIndex = 0) {
      const source = panels.length ? panels : state.storyboard;
      return source.map((item, index) => (
        `画面来源（分镜${startIndex + index + 1}）：${item.scene || ""}；人物状态：${item.action || ""}；镜头参考：${item.camera || "自由构图"}`
      )).join("\n") || (state.optimizedStory || state.story);
    }

    function illustrationVariantDirective(index = 1) {
      const variants = [
        "半身角色插画，人物正面或三分之二侧身，表情细腻，背景氛围柔和。",
        "全身角色立绘，姿态舒展，服装和配饰完整可见，背景空间简洁但有层次。",
        "动态姿态插画，人物有明确动作，衣摆、头发和光效形成动势，构图更有冲击力。",
        "近景情绪特写，重点表现眼神、表情和面部细节，背景虚化成氛围色块。",
        "环境叙事插画，角色处在场景中，利用光线、前景和远景表现空间感。",
        "低机位或仰视构图，强化角色气场和戏剧感，画面更有张力。",
        "俯视或斜角构图，突出角色与场景关系，营造新鲜视角。",
        "背影或回眸构图，强调氛围、服装轮廓和故事悬念。"
      ];
      return variants[(Math.max(1, Number(index) || 1) - 1) % variants.length];
    }

    function buildPromptPreview(panels = null, options = {}) {
      let startIndex = options.startIndex ?? 0;
      const pageIndex = options.pageIndex || 1;
      const pageCount = options.pageCount || effectiveImageCount();
      if (!Array.isArray(panels)) {
        const context = promptPageContext(pageIndex - 1, pageCount);
        panels = context.panels.length ? context.panels : state.storyboard;
        startIndex = context.start;
      }
      const selectedReferences = options.selectedReferences || selectReferencesForPanels(panels);
      const comicStyleBlock = state.outputMode === "comic"
        ? [
            "【剧情图漫画风格要求】",
            "生成一张竖版完整漫画页，不是单张普通插画，也不是写实照片。",
            `这是第 ${pageIndex}/${pageCount} 张剧情图。本张图必须正好表现下方列出的 ${panels.length} 个分镜，不能少格，不能多格，不要把其他分镜或后续剧情画进来。`,
            "版式必须有动态漫画感，不能太方方正正，不能做成平均网格或等分切割。",
            "分镜格大小要有主次变化：可使用大开场格、斜切分格、梯形/不规则边框、跨格人物、局部特写小格、气泡跨格、前景遮挡和动势线。",
            "整体布局参考动态国漫/日漫页面：上方可用宽幅环境格，中段用倾斜双格推进对白，下方用大特写或局部动作格强化情绪。",
            "分镜之间要有清楚的剧情推进，阅读顺序必须清晰，但边框和构图要有节奏感与视觉冲击。",
            "每一个分镜都必须有主角对白气泡，不要旁白框，台词内容以本提示词列出的主角台词为准。",
            "画风要求：精致日漫/国漫校园漫画风，干净线稿，柔和上色，细腻表情，明亮但有层次的场景光影。",
            "文字区域留白明确，气泡不要遮挡人物脸部。",
            "人物必须严格参考上传的角色图，保持发型、发色、脸型、服装、配饰和气质一致。",
            "场景必须参考上传的场景图，保持空间结构、固定道具、光线方向和色调一致。"
          ].join("\n")
        : [
            "【纯图风格要求】",
            "生成单张完整分镜稿 / 电影分镜概念图，不做多格漫画排版，不切分镜。",
            `这是第 ${pageIndex}/${pageCount} 张纯图，只表现分镜 ${startIndex + 1}，不得复用第 1 个分镜或混入其他分镜内容。`,
            "人物数量、动作和场景必须跟随当前这一条分镜；如果多人同框，必须写清每个角色的站位、互动、前后景层次和对应参考图。",
            "纯图中不能出现对白、台词、文字、旁白、对话气泡或漫画格边框。",
            "参考图优先级最高：构图变化、镜头变化和画风描述不能改变参考图中的角色脸、发型、服装、配饰、体型气质或场景结构。",
            "人物必须严格参考上传的角色图，保持发型、发色、脸型、服装、配饰和气质一致。",
            "场景或背景参考上传的场景图，保持视觉基调一致。",
            "画风要求：精致日漫/国漫插画风，画面完整，构图明确，光影细腻。"
          ].join("\n");
      return [
        `生图模式：${state.outputMode === "comic" ? "剧情图" : "纯图"}`,
        `生成数量：${pageCount}`,
        `画面比例：${state.aspectRatio}`,
        `生图质量等级：${state.imageQuality || API_CONFIG.imageQuality}`,
        `文字模型：${textModelLabel()}`,
        `生图模型：${imageModelLabel()}`,
        "",
        "【语言要求】",
        `最终传给 ${imageModelLabel()} 的 prompt 必须固定为中文。除 image[0] / images[0] 这类必要数组标识、API 模型名、文件名外，不要输出英文句子或英文描述。`,
        "",
        comicStyleBlock,
        "",
        buildReferenceBindingBlock(selectedReferences),
        "",
        buildConsistencyBlock(selectedReferences),
        "",
        "【作品设定资料】",
        projectBibleText(),
        "",
        buildContinuityBlock(pageIndex),
        "",
        "【优化剧情】",
        state.optimizedStory || state.story,
        "",
        state.outputMode === "comic" ? "【本张图仅使用的分镜】" : "【画面规划】",
        state.outputMode === "comic" ? formatStoryboardPanels(panels, startIndex) : [
          formatIllustrationSource(panels, startIndex),
          "",
          `【本张纯图规则】本张只画分镜 ${startIndex + 1}，一张图只对应这一条分镜。人物数量跟随本画面涉及角色；可以多人同框，但不得新增未绑定参考图的主角。`,
          "禁止出现任何对白、台词、文字、旁白、对话气泡、漫画分格或多格排版。"
        ].join("\n")
      ].join("\n");
    }

    async function generateImagePromptWithDeepSeek({ basePrompt, panels, selectedReferences, startIndex, pageIndex, pageCount }) {
      const panelCount = panels.length;
      const referenceBinding = buildReferenceBindingBlock(selectedReferences);
      if (state.outputMode !== "comic") {
        const content = await callTextModel(renderPromptTemplate("illustrationImagePrompt", {
          pageIndex,
          pageCount,
          aspectRatio: state.aspectRatio,
          imageQuality: state.imageQuality || API_CONFIG.imageQuality,
          imageModelLabel: imageModelLabel(),
          referenceField: imageModelConfig().provider === "grsai" ? "images" : "image",
          projectBible: projectBibleText(),
          referenceBinding,
          consistencyBlock: buildConsistencyBlock(selectedReferences),
          illustrationSource: formatIllustrationSource(panels, startIndex),
          illustrationVariant: `本张只画分镜 ${startIndex + 1}，不得复用第 1 个分镜或混入其他分镜。`,
          panelNumber: startIndex + 1,
          basePrompt
        }));
        const trimmed = (content || "").trim();
        if (!trimmed) throw new Error(`${textModelLabel()} 未返回纯图生图提示词。`);
        return trimmed;
      }
      const content = await callTextModel(renderPromptTemplate("comicImagePrompt", {
        pageIndex,
        pageCount,
        panelCount,
        panelRange: `${startIndex + 1}-${startIndex + panelCount}`,
        aspectRatio: state.aspectRatio,
        imageQuality: state.imageQuality || API_CONFIG.imageQuality,
        imageModelLabel: imageModelLabel(),
        referenceField: imageModelConfig().provider === "grsai" ? "images" : "image",
        projectBible: projectBibleText(),
        referenceBinding,
        consistencyBlock: buildConsistencyBlock(selectedReferences),
        continuityBlock: buildContinuityBlock(pageIndex),
        storyboardPanels: formatStoryboardPanels(panels, startIndex),
        expectedPanelCount: panelCount,
        basePrompt
      }));
      const trimmed = (content || "").trim();
      if (!trimmed) throw new Error(`${textModelLabel()} 未返回生图提示词。`);
      return trimmed;
    }

    function promptPageContext(index, pageCount = effectiveImageCount()) {
      const panelsPerImage = state.outputMode === "comic" ? Math.max(3, Math.min(8, Number(state.panelsPerComicImage) || 4)) : 1;
      const start = state.outputMode === "comic" ? index * panelsPerImage : index;
      const panels = state.outputMode === "comic"
        ? state.storyboard.slice(start, start + panelsPerImage)
        : state.storyboard.slice(start, start + 1);
      return { count: pageCount, panelsPerImage, start, panels };
    }

    async function createPromptForIndex(index, count, createdAt) {
      const { start, panels } = promptPageContext(index, count);
      if (!panels.length) return null;
      const panelsPerImage = state.outputMode === "comic" ? Math.max(3, Math.min(8, Number(state.panelsPerComicImage) || 4)) : 1;
      if (state.outputMode === "comic" && panels.length !== panelsPerImage) return null;
      const selectedReferences = selectReferencesForPanels(panels);
      const prompt = buildPromptPreview(panels, {
        startIndex: start,
        pageIndex: index + 1,
        pageCount: count,
        selectedReferences
      });
      let itemPrompt = [
        prompt,
        "",
        `本次生成第 ${index + 1} 张。`,
        `本次实际传给 ${imageModelLabel()} 的参考图数组：${selectedReferences.map((ref, refIndex) => `${referenceSlotName(refIndex)}=${ref.roleName || ref.name}`).join("；") || "无"}`,
        "语言要求：最终 prompt 固定使用中文，除 image[n] 等必要标识外不要使用英文描述。",
        state.outputMode === "comic"
          ? `输出为剧情图：本张只画分镜 ${start + 1}-${start + panels.length}，不要画其他分镜。必须是一张包含 ${panels.length} 个分镜的动态漫画页，每个分镜都有角色对白气泡，不要旁白框。`
          : `输出为纯图：本张只画分镜 ${start + 1} 的单张分镜稿 / 电影分镜概念图，不切分镜，不做漫画排版；人物数量跟随当前分镜涉及角色，可多人同框；禁止出现未绑定参考图的新主角、对白、台词、文字、旁白、对话气泡和漫画格。`
      ].join("\n");
      if (shouldUseRealApi()) {
        busyText = `正在调用 ${textModelLabel()} 生成第 ${index + 1}/${count} 张专属生图提示词...`;
        render();
        itemPrompt = await generateImagePromptWithDeepSeek({
          basePrompt: prompt,
          panels,
          selectedReferences,
          startIndex: start,
          pageIndex: index + 1,
          pageCount: count
        });
        addRecordLog(`${textModelLabel()} 已生成第 ${index + 1} 张生图提示词`);
      }
      return {
        id: uid("prompt"),
        title: `${state.outputMode === "comic" ? "剧情图" : "纯图"}-${index + 1} 提示词`,
        mode: state.outputMode,
        prompt: itemPrompt,
        referenceIds: selectedReferences.map(ref => ref.id),
        startIndex: start,
        panelCount: panels.length,
        status: "idle",
        errorMessage: "",
        continuitySummary: "",
        createdAt,
      };
    }

    async function generatePrompts() {
      if (!state.storyboardApproved) return;
      setBusy("正在生成每张图的生图提示词...");
      state.lastApiError = "";
      const count = effectiveImageCount();
      const createdAt = new Date().toLocaleString();
      const prompts = [];
      state.imagePrompts = [];
      state.results = [];
      const warn = comicGenerationWarning();
      if (warn) addRecordLog(warn);
      for (let index = 0; index < count; index += 1) {
        const { panels } = promptPageContext(index, count);
        if (!panels.length) {
          addRecordLog(`第 ${index + 1} 张没有可用分镜，已停止生成`);
          break;
        }
        try {
          const item = await createPromptForIndex(index, count, createdAt);
          if (item) prompts.push(item);
        } catch (error) {
          addRecordLog(`${textModelLabel()} 第 ${index + 1} 张生图提示词生成失败：${error.message}`);
          state.lastApiError = `${textModelLabel()} 第 ${index + 1} 张生图提示词生成失败：${error.message}`;
          if (!API_CONFIG.fallbackToMock) {
            alert(state.lastApiError);
            clearBusy();
            return;
          }
        }
      }
      state.imagePrompts = prompts;
      state.results = [];
      addRecordLog(`已生成 ${prompts.length} 条生图提示词，等待用户审核生成`);
      currentStep = "prompts";
      saveDraft(false);
      clearBusy();
    }

    async function regeneratePrompt(index) {
      if (!state.storyboardApproved) return;
      setBusy(`正在重新生成第 ${index + 1} 张提示词...`);
      state.lastApiError = "";
      try {
        const count = effectiveImageCount();
        const item = await createPromptForIndex(index, count, new Date().toLocaleString());
        if (!item) throw new Error("当前页没有可用分镜。");
        state.imagePrompts[index] = item;
        state.results = (state.results || []).filter(result => result.sourcePromptId !== item.id && result.pageIndex !== index + 1);
        addRecordLog(`已重新生成第 ${index + 1} 张提示词`);
        saveDraft(false);
      } catch (error) {
        state.lastApiError = `第 ${index + 1} 张提示词重新生成失败：${error.message}`;
        addRecordLog(state.lastApiError);
        alert(state.lastApiError);
      }
      clearBusy();
    }

    function updatePromptText(index, value) {
      if (!state.imagePrompts[index]) return;
      state.imagePrompts[index].prompt = value;
      saveDraft(false);
    }

    function copyPrompt(index) {
      const prompt = state.imagePrompts[index]?.prompt || "";
      if (!prompt) return;
      navigator.clipboard?.writeText(prompt);
      addRecordLog(`已复制第 ${index + 1} 条提示词`);
      saveDraft(false);
    }

    async function optimizeGeneratedPrompts() {
      if (!state.imagePrompts.length) return;
      const requirement = (state.promptOptimization || "").trim();
      if (!requirement) {
        alert("请先填写提示词优化要求。");
        return;
      }
      setBusy(`正在调用 ${textModelLabel()} 优化提示词...`);
      state.lastApiError = "";
      for (let index = 0; index < state.imagePrompts.length; index += 1) {
        const item = state.imagePrompts[index];
        if (shouldUseRealApi()) {
          try {
            busyText = `正在优化第 ${index + 1}/${state.imagePrompts.length} 条提示词...`;
            render();
            item.prompt = await callTextModel(renderPromptTemplate("optimizeImagePrompt", {
              imageModelLabel: imageModelLabel(),
              projectBible: projectBibleText(),
              requirement,
              originalPrompt: item.prompt
            }));
          } catch (error) {
            addRecordLog(`第 ${index + 1} 条提示词优化失败：${error.message}`);
            state.lastApiError = `第 ${index + 1} 条提示词优化失败：${error.message}`;
            if (!API_CONFIG.fallbackToMock) {
              alert(state.lastApiError);
              clearBusy();
              return;
            }
          }
        } else {
          item.prompt = `${item.prompt}\n\n【用户优化要求】\n${requirement}`;
        }
      }
      addRecordLog("提示词已根据优化要求更新");
      saveDraft(false);
      clearBusy();
    }

    async function continuityReferenceImagesForPage(index) {
      if (state.outputMode !== "comic" || index <= 0) return [];
      const previousResult = previousResultForPage(index + 1);
      if (!previousResult?.url) return [];
      try {
        const config = imageModelConfig();
        const maxBytes = config.provider === "grsai" ? 520 * 1024 : 760 * 1024;
        const maxSide = config.provider === "grsai" ? 900 : 1100;
        return [await compressImageDataUrl(previousResult.url, { maxSide, maxBytes, quality: 0.74 })];
      } catch (error) {
        addRecordLog(`上一页图片连续性参考压缩失败，已降级为文本连续性：${error.message}`);
        return [];
      }
    }

    function resultIndexByPromptId(promptId) {
      return (state.results || []).findIndex(result => result.sourcePromptId === promptId);
    }

    function upsertResult(result) {
      const index = resultIndexByPromptId(result.sourcePromptId);
      if (index >= 0) state.results[index] = result;
      else state.results.push(result);
    }

    async function buildContinuitySummaryForPrompt(item, index, url) {
      if (state.outputMode !== "comic") return "";
      const { panels } = promptPageContext(index, state.imagePrompts.length);
      const fallback = [
        `第 ${index + 1} 页剧情已生成。`,
        `分镜范围：${item.startIndex + 1}-${item.startIndex + item.panelCount}。`,
        "下一页需要延续本页的角色状态、服装、关键道具、场景时间、光线和背景结构。"
      ].join(" ");
      if (!shouldUseRealApi()) return fallback;
      try {
        const summary = await callTextModel(renderPromptTemplate("continuitySummary", {
          storyboardPanels: formatStoryboardPanels(panels, item.startIndex || 0),
          prompt: item.prompt,
          imageUrl: url || ""
        }));
        return (summary || "").trim() || fallback;
      } catch (error) {
        addRecordLog(`第 ${index + 1} 页连续性摘要生成失败，使用本地摘要：${error.message}`);
        return fallback;
      }
    }

    async function generateSingleImage(index, options = {}) {
      const item = state.imagePrompts[index];
      if (!item) return null;
      const standalone = !options.batch;
      if (standalone) setBusy(`正在生成第 ${index + 1} 张图片...`);
      state.lastApiError = "";
      item.status = "generating";
      item.errorMessage = "";
      saveDraft(false);
      render();
      const createdAt = new Date().toLocaleString();
      try {
        const selectedReferences = (item.referenceIds || [])
          .map(id => state.references.find(ref => ref.id === id))
          .filter(Boolean);
        const baseReferenceImages = await getReferenceImagesForApi(selectedReferences);
        const continuityImages = await continuityReferenceImagesForPage(index);
        const referenceImages = [...baseReferenceImages, ...continuityImages];
        const continuityBlock = buildContinuityBlock(index + 1);
        const runtimePrompt = [item.prompt, "", continuityBlock].join("\n");
        busyText = `正在调用 ${imageModelLabel()} 生成第 ${index + 1}/${state.imagePrompts.length} 张...`;
        render();
        addRecordLog(`第 ${index + 1} 张使用 ${selectedImageInterfaceName(referenceImages.length)}，传入参考图 ${referenceImages.length} 张`);
        let url = shouldUseRealApi()
          ? await callImageModel(runtimePrompt, referenceImages)
          : imagePlaceholder(state.outputMode === "comic" ? `剧情图 ${index + 1}` : `纯图 ${index + 1}`, index);
        if (!url) url = imagePlaceholder(state.outputMode === "comic" ? `剧情图 ${index + 1}` : `纯图 ${index + 1}`, index);
        item.status = "success";
        item.errorMessage = "";
        item.continuitySummary = await buildContinuitySummaryForPrompt(item, index, url);
        const result = {
          id: uid("img"),
          sourcePromptId: item.id,
          pageIndex: index + 1,
          status: "success",
          title: `${state.outputMode === "comic" ? "剧情图" : "纯图"}-${index + 1}`,
          mode: state.outputMode,
          url,
          prompt: runtimePrompt,
          continuitySummary: item.continuitySummary,
          createdAt,
          best: false
        };
        upsertResult(result);
        state.records = [result, ...(state.records || []).filter(record => record.sourcePromptId !== result.sourcePromptId)].slice(0, 60);
        addRecordLog(`第 ${index + 1} 张生成成功`);
        saveDraft(false);
        if (standalone) {
          currentStep = "preview";
          clearBusy();
        } else {
          render();
        }
        return result;
      } catch (error) {
        item.status = "failed";
        item.errorMessage = error.message;
        const failed = {
          id: uid("img-failed"),
          sourcePromptId: item.id,
          pageIndex: index + 1,
          status: "failed",
          title: `${state.outputMode === "comic" ? "剧情图" : "纯图"}-${index + 1}`,
          mode: state.outputMode,
          url: "",
          prompt: item.prompt,
          errorMessage: error.message,
          createdAt,
          best: false
        };
        upsertResult(failed);
        state.lastApiError = `${imageModelLabel()} 第 ${index + 1} 张调用失败：${error.message}`;
        addRecordLog(state.lastApiError);
        saveDraft(false);
        render();
        if (standalone) {
          alert(state.lastApiError);
          clearBusy();
        }
        return failed;
      }
    }

    async function generateImagesFromPrompts() {
      if (!state.imagePrompts.length) return;
      setBusy(`正在调用 ${imageModelLabel()} 生成图片...`);
      state.lastApiError = "";
      currentStep = "preview";
      for (let index = 0; index < state.imagePrompts.length; index += 1) {
        await generateSingleImage(index, { batch: true });
      }
      const successCount = (state.imagePrompts || []).filter(item => item.status === "success").length;
      const failedCount = (state.imagePrompts || []).filter(item => item.status === "failed").length;
      addRecordLog(`批量生成完成：成功 ${successCount} 张，失败 ${failedCount} 张`);
      saveDraft(false);
      clearBusy();
    }

    function markBest(id) {
      state.results = state.results.map(item => ({ ...item, best: item.id === id ? !item.best : item.best }));
      state.records = state.records.map(item => item.id === id ? { ...item, best: !item.best } : item);
      saveDraft(false);
    }

    function clearRecords() {
      state.records = [];
      addRecordLog("已清空历史生成记录");
      saveDraft(false);
    }

    function downloadProject() {
      downloadBlob("AI漫画角色生图项目.json", JSON.stringify(state, null, 2), "application/json");
    }

    function downloadBlob(filename, content, type) {
      const blob = new Blob([content], { type: `${type};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    Promise.all([
      restoreReferenceImages().catch(error => console.warn("参考图恢复失败", error)),
      loadPromptTemplates()
    ])
      .catch(error => console.warn("参考图恢复失败", error))
      .finally(() => render());
  </script>
</body>
</html>
